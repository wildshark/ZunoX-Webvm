<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#060a13" />
    <meta
      name="description"
      content="ZunoX — a browser terminal into an Alpine Linux container running Apache and PHP."
    />
    <title>ZunoX · Alpine Linux Terminal</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/vendor/xterm/xterm.css" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="app" id="app">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <rect x="2.5" y="4" width="19" height="16" rx="3" />
              <path d="m6.5 9.5 3 2.5-3 2.5M12 15h5" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </span>
          <div class="brand-text">
            <h1>ZunoX</h1>
            <p>Alpine Linux · PHP · Apache</p>
          </div>
        </div>

        <div class="topbar-actions">
          <span class="status-pill" id="status-pill" data-state="connecting" role="status" aria-live="polite">
            <span class="status-dot"></span>
            <span class="status-label" id="status-text">Connecting</span>
          </span>

          <a class="btn btn-ghost" id="site-link" href="#" target="_blank" rel="noopener noreferrer">
            <span class="btn-label">PHP site</span>
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
              <path d="M14 4h6v6M20 4l-8.5 8.5" stroke-linecap="round" stroke-linejoin="round" />
              <path d="M18 14v4.5A1.5 1.5 0 0 1 16.5 20h-11A1.5 1.5 0 0 1 4 18.5v-11A1.5 1.5 0 0 1 5.5 6H10" stroke-linecap="round" />
            </svg>
          </a>

          <button class="btn btn-ghost" id="btn-clear" type="button" title="Clear the screen (sends Ctrl+L)">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
              <path d="m4 7 8-4 8 4-8 4-8-4Z" stroke-linejoin="round" />
              <path d="m4 12 8 4 8-4M4 17l8 4 8-4" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <span class="btn-label">Clear</span>
          </button>

          <button class="btn btn-ghost" id="btn-reconnect" type="button" title="Restart the terminal session">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
              <path d="M20 12a8 8 0 1 1-2.34-5.66" stroke-linecap="round" />
              <path d="M20 4v5h-5" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <span class="btn-label">Reconnect</span>
          </button>

          <button class="btn btn-icon" id="btn-fullscreen" type="button" title="Toggle fullscreen" aria-label="Toggle fullscreen">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
              <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
        </div>
      </header>

      <main class="terminal-shell">
        <div class="terminal-frame" id="terminal-frame">
          <div class="terminal-chrome">
            <span class="window-dots" aria-hidden="true">
              <span class="dot dot-red"></span>
              <span class="dot dot-yellow"></span>
              <span class="dot dot-green"></span>
            </span>
            <span class="chrome-title" id="chrome-title">root@webvm</span>
            <span class="chrome-badge">xterm-256color</span>
          </div>

          <div class="terminal-stage">
            <div class="terminal" id="terminal" aria-label="Interactive container terminal"></div>

            <div class="terminal-overlay" id="overlay">
              <span class="spinner" aria-hidden="true"></span>
              <p id="overlay-text">Attaching to the container…</p>
              <span class="overlay-hint" id="overlay-hint">Alpine Linux · Apache · PHP</span>
              <button class="overlay-action" id="overlay-action" type="button" hidden>Start a new session</button>
            </div>
          </div>
        </div>
      </main>

      <footer class="statusbar">
        <div class="status-group">
          <span class="stat" id="stat-connection">offline</span>
          <span class="sep" aria-hidden="true"></span>
          <span class="stat" id="stat-host">host —</span>
          <span class="sep" aria-hidden="true"></span>
          <span class="stat" id="stat-shell">shell —</span>
          <span class="sep" aria-hidden="true"></span>
          <span class="stat" style="display:inline-flex;align-items:center;gap:6px;">
            <span id="stat-cpu">cpu —%</span>
            <span style="width:48px;height:5px;background:rgba(255,255,255,0.12);border-radius:999px;overflow:hidden;display:inline-block;">
              <span id="cpu-bar" style="display:block;height:100%;width:0%;background:#38bdf8;transition:width .3s;"></span>
            </span>
          </span>
          <span class="sep" aria-hidden="true"></span>
          <span class="stat" style="display:inline-flex;align-items:center;gap:6px;">
            <span id="stat-mem">mem —%</span>
            <span style="width:48px;height:5px;background:rgba(255,255,255,0.12);border-radius:999px;overflow:hidden;display:inline-block;">
              <span id="mem-bar" style="display:block;height:100%;width:0%;background:#10b981;transition:width .3s;"></span>
            </span>
          </span>
        </div>
        <div class="status-group">
          <span class="stat" id="stat-size">— × —</span>
          <span class="sep" aria-hidden="true"></span>
          <span class="stat" id="stat-clock">--:--:--</span>
        </div>
      </footer>
    </div>

    <script src="/config.js"></script>
    <script src="/vendor/xterm/xterm.js"></script>
    <script src="/vendor/addon-fit/addon-fit.js"></script>
    <script src="/vendor/addon-web-links/addon-web-links.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
