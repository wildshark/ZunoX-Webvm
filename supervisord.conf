; WebVM processes. Included by /etc/supervisord.conf.
[program:apache]
command=/usr/sbin/httpd -D FOREGROUND
priority=10
autostart=true
autorestart=true
startsecs=2
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:webvm-terminal]
command=/usr/bin/node /app/server.js
directory=/app
priority=20
autostart=true
autorestart=true
startsecs=2
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
