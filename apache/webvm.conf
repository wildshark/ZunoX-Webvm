# WebVM Apache configuration, included from /etc/apache2/conf.d/.
ServerName webvm
ServerTokens Min
ServerSignature Off

# Keep Apache logs in `docker logs` as well as on disk.
ErrorLog /dev/stderr
CustomLog /dev/stdout combined

<Directory "/var/www/localhost/htdocs">
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# Isolate admin.php from the public/tenant port 80
<VirtualHost *:80>
    DocumentRoot /var/www/localhost/htdocs
    <Files "admin.php">
        Require all denied
    </Files>
</VirtualHost>

# Admin panel on port 8082
Listen 8082
<VirtualHost *:8082>
    ServerName admin.webvm
    DocumentRoot /var/www/localhost/htdocs
    <Directory "/var/www/localhost/htdocs">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    <Files "admin.php">
        SetHandler application/x-httpd-php
    </Files>
</VirtualHost>

<IfModule mod_headers.c>
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
</IfModule>

IncludeOptional /etc/apache2/conf.d/tenants/*.conf